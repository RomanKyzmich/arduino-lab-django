{% extends 'core/base.html' %}
{% block page_styles %} <style> /* ... (всі ваші стилі) ... */ </style> {% endblock %}

{% block content %}
    <h1 class="mb-3">{{ stand.name }}</h1>
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">Опис стенду</div>
                <div class="card-body"><p>{{ stand.description }}</p></div>
            </div>

            <div class="card mt-4">
                <div class="card-header">Редактор коду (Arduino C++)</div>
                <div class="card-body">
                    <textarea id="code-editor" ... >...</textarea>

                    <div class="mt-3 d-flex align-items-center flex-wrap">

                        <button id="flash-button" class="btn btn-success me-2 mb-2" data-stand-id="{{ stand.pk }}">
                            🚀 Прошити стенд
                        </button>

                        <button id="compile-button" class="btn btn-warning me-2 mb-2" data-stand-id="{{ stand.pk }}">
                            🔧 Скомпілювати
                        </button>

                        <label for="file-input" class="btn btn-info me-2 mb-2">
                            📂 Завантажити .ino
                        </label>
                        <input type="file" id="file-input" accept=".ino">

                        <div class="me-3 mb-2">
                            <label for="baud-rate-select" class="form-label-sm mb-0">Швидкість (Baud):</label>
                            <select id="baud-rate-select" ... > ... </select>
                        </div>

                        <form id="release-form" ... >
                            <button type="submit" class="btn btn-danger">
                                🛑 Завершити роботу
                            </button>
                        </form>
                    </div>
                    </div>
            </div>

            <div class="card mt-4">
                </div>

        </div> <div class="col-md-4">
            <div class="card mt-4">
                <div class="card-header">Монітор порту / Лог прошивки</div>
                <pre class="log-monitor"><code id="port-monitor">[... очікування дій ...]</code></pre>
            </div>
        </div>
    </div>
{% endblock %}


{% block page_scripts %}
<script>
    // ... (всі існуючі функції: getCookie, pollJobStatus, sendHeartbeat, sendJob) ...
    function getCookie(name) { /* ... */ }
    const csrftoken = getCookie('csrftoken');
    function pollJobStatus(jobId, monitorElement, endpoint, onDoneCallback = null) { /* ... */ }
    function sendHeartbeat() { /* ... */ }
    function sendJob(endpoint, payload, monitorElement) { /* ... */ }

    // ==========================================================
    // --- ОСНОВНИЙ СКРИПТ (DOMContentLoaded) ---
    // ==========================================================
    document.addEventListener('DOMContentLoaded', (event) => {
        // --- 1. Знаходимо елементи ---
        const flashButton = document.getElementById('flash-button');
        // 🔽🔽🔽 1. ЗНАЙДІТЬ НОВУ КНОПКУ 🔽🔽🔽
        const compileButton = document.getElementById('compile-button');

        const codeEditorElement = document.getElementById('code-editor');
        const portMonitor = document.getElementById('port-monitor');
        // ... (решта елементів: releaseForm, fileInput, lib...)

        const standId = flashButton.dataset.standId;
        const localStorageKey = `lab-code-stand-${standId}`;

        // --- 2. ІНІЦІАЛІЗАЦІЯ CODEMIRROR ---
        const editor = CodeMirror.fromTextArea(codeEditorElement, { /* ... */ });

        // --- 3. ЗАВАНТАЖЕННЯ ЗБЕРЕЖЕНОГО КОДУ ---
        const savedCode = localStorage.getItem(localStorageKey);
        if (savedCode) { editor.setValue(savedCode); }

        // --- 4. ПРИВ'ЯЗКА ПОДІЙ ---

        // 4.1 ЗБЕРЕЖЕННЯ КОДУ
        // ... (без змін) ...

        // 4.2 "Слухач" кнопки "Прошити" (FLASH)
        flashButton.addEventListener('click', () => {
            const code = editor.getValue();
            const baudRate = document.getElementById('baud-rate-select').value;
            if (!code.trim()) { alert('Поле коду не може бути порожнім!'); return; }

            // Блокуємо ОБИДВІ кнопки
            flashButton.disabled = true;
            compileButton.disabled = true;
            editor.setOption("readOnly", true);

            const payload = {
                'stand': standId,
                'code_to_flash': code, // <--- code_to_flash
                'status': 'pending',
                'baud_rate': parseInt(baudRate, 10)
            };

            // Використовуємо 'port-monitor' для логів
            sendJob('/api/jobs/', payload, portMonitor)
                .then(data => {
                    portMonitor.textContent = `[${new Date().toLocaleTimeString()}] Завдання #${data.id} (Прошивка) створено. Очікуємо...`;
                    pollJobStatus(data.id, portMonitor, '/api/jobs/', () => {
                        // onDone
                        flashButton.disabled = false;
                        compileButton.disabled = false;
                        editor.setOption("readOnly", false);
                    });
                })
                .catch(error => { /* ... (обробка помилок) ... */ });
        });

        // 🔽🔽🔽 4.3 НОВИЙ "СЛУХАЧ" ДЛЯ КОМПІЛЯЦІЇ 🔽🔽🔽
        if (compileButton) {
            compileButton.addEventListener('click', () => {
                const code = editor.getValue();
                if (!code.trim()) { alert('Поле коду не може бути порожнім!'); return; }

                // Блокуємо ОБИДВІ кнопки
                flashButton.disabled = true;
                compileButton.disabled = true;
                editor.setOption("readOnly", true); // Блокуємо редактор

                const payload = {
                    'stand': standId,
                    'code_to_compile': code, // <--- code_to_compile
                    'status': 'pending'
                };

                // Використовуємо той самий 'port-monitor' для логів
                sendJob('/api/compile-jobs/', payload, portMonitor)
                    .then(data => {
                        portMonitor.textContent = `[${new Date().toLocaleTimeString()}] Завдання #${data.id} (Компіляція) створено. Очікуємо...`;
                        pollJobStatus(data.id, portMonitor, '/api/compile-jobs/', () => {
                            // onDone
                            flashButton.disabled = false;
                            compileButton.disabled = false;
                            editor.setOption("readOnly", false); // Розблоковуємо редактор
                        });
                    })
                    .catch(error => {
                        try { const errData = JSON.parse(error.message);
                            portMonitor.textContent = `[${new Date().toLocaleTimeString()}] ПОМИЛКА! ${errData.error}`;
                        } catch(e) { portMonitor.textContent = `[${new Date().toLocaleTimeString()}] ПОМИЛКА! ${error.message}`; }

                        flashButton.disabled = false;
                        compileButton.disabled = false;
                        editor.setOption("readOnly", false);
                    });
            });
        }

        // ... (решта слухачів: 4.4 Lib Install (Name), 4.5 Lib Install (ZIP), 4.6 Lib Uninstall, 4.7 Release Form, 4.8 Heartbeat, 4.9 .ino Upload) ...
        // (Переконайтеся, що їхні номери тепер зміщені)

    });
</script>
{% endblock %}
