{% extends 'core/base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Вхід</h2>

        {% if form.errors %}
            <div class="alert alert-danger">
                Ваш логін або пароль невірні. Спробуйте ще раз.
            </div>
        {% endif %}

        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary mt-3">Увійти</button>
                </form>
            </div>
        </div>
        <p class="mt-3">
            Немає акаунту? <a href="{% url 'signup' %}">Зареєструйтеся</a>.
        </p>
    </div>
</div>
{% endblock %}
