{% extends 'core/base.html' %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Реєстрація нового користувача</h2>
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary mt-3">Зареєструватися</button>
                </form>
            </div>
        </div>
        <p class="mt-3">
            Вже маєте акаунт? <a href="{% url 'login' %}">Увійдіть тут</a>.
        </p>
    </div>
</div>
{% endblock %}
